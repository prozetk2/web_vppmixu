version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database URLs
      DATABASE_URL: postgresql://app:app@db:5432/appdb?schema=public
      DIRECT_URL: postgresql://app:app@db:5432/appdb?schema=public
      
      # Server configuration
      PORT: ${PORT:-3000}
      
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-45a3ffb283c047be6709c6f003d2ee2cca3797684af8e69cc0fdad34fa7d532f}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      
      # Supabase Configuration (optional)
      SUPABASE_URL: ${SUPABASE_URL:-https://your-project-ref.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-your-service-role-key-here}
      
      # Environment
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./.env:/app/.env
      # Use named volumes for node_modules to avoid conflicts with host
      - node_modules:/app/node_modules
    restart: unless-stopped
    command: >
      sh -c "
        if [ ! -f .env ]; then
          echo 'Creating .env from .env.example...'
          cp .env.example .env
        fi &&
        echo 'Running npm install...' &&
        npm install &&
        echo 'Generating Prisma client...' &&
        npm run prisma:generate &&
        echo 'Starting development server...' &&
        npm run start:dev
      "

volumes:
  db_data:
  node_modules:
