server {
    listen 80;
    server_name vppmixuri.com www.vppmixuri.com;

    # Tự động chuyển hướng người dùng sang HTTPS an toàn
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name vppmixuri.com www.vppmixuri.com;

    # --- CẤU HÌNH SSL (Quan trọng nhất) ---
    # Đường dẫn này đã khớp với thư mục bạn vừa kiểm tra
    ssl_certificate /etc/letsencrypt/live/vppmixuri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vppmixuri.com/privkey.pem;

    # Tăng cường bảo mật SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- Cấu hình cho React Frontend ---
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # --- Cấu hình nối xuống Backend (Con Bot) ---
    location /api/ {
        proxy_pass http://web_vppmixu-backend-1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
