version: "3.9"

services:
  db:
    # Kế thừa cấu hình từ docker-compose.yml (image, env, healthcheck)
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@db:5432/appdb?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://app:app@db:5432/appdb?schema=public}
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-45a3ffb283c047be6709c6f003d2ee2cca3797684af8e69cc0fdad34fa7d532f}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    command: sh -c "npm run prisma:generate && npm run start:dev"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/dist
    restart: unless-stopped
