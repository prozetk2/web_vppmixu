services:
  # Local PostgreSQL (optional - comment out if using Supabase only)
  # db:
  #   image: postgres:15-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: app
  #     POSTGRES_PASSWORD: app
  #     POSTGRES_DB: appdb
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - db_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Load all environment variables from .env file (including Supabase DATABASE_URL)
    env_file:
      - .env
    environment:
      # Override NODE_ENV for development
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./.env:/app/.env
      # Mount config files needed for build
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      - ./nest-cli.json:/app/nest-cli.json
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      # Use named volumes for node_modules to avoid conflicts with host
      - node_modules:/app/node_modules
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Running npm install...' &&
        npm install &&
        echo 'Generating Prisma client...' &&
        npm run prisma:generate &&
        echo 'Starting development server...' &&
        npm run start:dev
      "

volumes:
  # db_data:
  node_modules:
