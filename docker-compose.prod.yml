services:
  backend:
    env_file:
      - ./backend/.env.prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "3000"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"  # ĐỔI THÀNH CỔNG 8080 (hoặc cổng khác trừ 80, 443, 81)
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf # DÙNG FILE NGON (không có chữ -ssl)
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  app-network:
    driver: bridge