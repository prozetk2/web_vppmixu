# Production Docker Compose for AWS Lightsail
# This builds and runs both frontend and backend for production
# Best practice: Backend không expose công khai, Frontend proxy /api/ sang Backend

services:
  backend:
    env_file:
      - ./backend/.env.prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "3000"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
